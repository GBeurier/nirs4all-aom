name: Publish AOM WebAssembly demo

on:
  push:
    branches: [main]
    paths:
      - "demo/wasm/**"
      - ".github/workflows/pages-wasm-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/wasm
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
